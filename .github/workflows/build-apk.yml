name: Build Sweety AI APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Generate Release Keystore
        run: |
          keytool -genkey -v -keystore sweety-android/release.keystore -alias sweety -keyalg RSA -keysize 2048 -validity 10000 -storepass sweetyai_password -keypass sweetyai_password -dname "CN=SweetyAI, OU=Assistant, O=Sweety, L=Dhaka, S=Dhaka, C=BD"

      - name: Build Signed Release and Debug APKs with Gradle
        working-directory: ./sweety-android
        run: gradle assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Prepare APKs for Release
        run: |
          cp sweety-android/app/build/outputs/apk/release/app-release.apk Sweety-AI.apk
          cp sweety-android/app/build/outputs/apk/debug/app-debug.apk Sweety-AI-Debug.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Sweety-AI-APKs
          path: |
            Sweety-AI.apk
            Sweety-AI-Debug.apk

      - name: Publish Direct APK Download Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Sweety AI Official Release (v1.0.2)"
          draft: false
          prerelease: false
          files: |
            Sweety-AI.apk
            Sweety-AI-Debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
